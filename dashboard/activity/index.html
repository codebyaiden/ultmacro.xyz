<body class="dashboard-app-page dashboard-activity-page">
  <a class="dashboard-app-skip" href="#main">Skip to content</a>
  <header class="dashboard-app-fallback"><a href="/">Ultimate Macro</a></header>
  <main id="main" class="dashboard-app-shell">
    <aside class="dashboard-sidebar" aria-label="Dashboard sections">
      <nav class="dashboard-section-nav">
        <a href="/dashboard/overview/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/manage.svg')" aria-hidden="true"></span><span>Overview</span></a>
        <a href="/dashboard/manage/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/manage-controls.svg')" aria-hidden="true"></span><span>Manage</span></a>
        <a href="/dashboard/activity/" aria-current="page"><span class="nav-icon activity-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/activity.svg')" aria-hidden="true"></span><span>Activity</span></a>
        <a href="/dashboard/remote/"><span class="nav-icon remote-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/remote.svg')" aria-hidden="true"></span><span>Remote</span></a>
        <a href="/dashboard/earnings/"><span class="nav-icon earnings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/earnings.svg')" aria-hidden="true"></span><span>Earnings</span></a>
        <a href="/dashboard/strategies/"><span class="nav-icon strategies-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/strategies.svg')" aria-hidden="true"></span><span>Strategies</span></a><a href="/dashboard/health/"><span class="nav-icon health-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/health.svg')" aria-hidden="true"></span><span>Health</span></a>
        <a href="/dashboard/devices/"><span class="nav-icon devices-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/devices.svg')" aria-hidden="true"></span><span>Devices</span></a>
        <a href="/dashboard/notifications/"><span class="nav-icon notification-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/notifications.svg')" aria-hidden="true"></span><span>Notifications</span></a>
      </nav>
      <div class="dashboard-sidebar-bottom">
        <a href="/dashboard/settings/"><span class="nav-icon settings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/settings.svg')" aria-hidden="true"></span><span>Settings</span></a>
      </div>
    </aside>

    <div class="dashboard-app-content activity-content">
      <header class="activity-heading">
        <div class="activity-title-wrap"><h1>Activity</h1></div>
        <div class="activity-filter-wrap">
          <button class="activity-filter-toggle" type="button" data-filter-toggle aria-expanded="false" aria-controls="activity-filters">
            <img src="/assets/dashboard-icons/flat/SVG_Source/General_Controls/filter.svg" alt="">
            <span>Filters</span>
            <img class="filter-chevron" src="/assets/dashboard-icons/flat/SVG_Source/General_Controls/expand_collapse.svg" alt="">
          </button>
          <section class="activity-filter-panel" id="activity-filters" data-filter-panel data-open="false" aria-label="Activity filters" aria-hidden="true" inert>
            <div class="filter-panel-top">
              <label class="exclude-toggle"><input type="checkbox" data-exclude-mode><span>Don't Show</span></label>
              <button class="filter-clear" type="button" data-clear-filters>Clear</button>
            </div>

            <section class="filter-group" data-filter-group="Startup" data-open="false">
              <button class="filter-group-toggle" type="button" aria-expanded="false"><span>Startup</span><img src="/assets/dashboard-icons/flat/SVG_Source/General_Controls/expand_collapse.svg" alt=""></button>
              <div class="filter-options"><div class="filter-options-inner">
                <label class="filter-option"><input type="checkbox" data-everything="Startup"><span>Everything</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="joined_roblox"><span>Joined Roblox</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="mode_selected"><span>Mode selected</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="match_started"><span>Match started</span></label>
              </div></div>
            </section>

            <section class="filter-group" data-filter-group="Strategy" data-open="false">
              <button class="filter-group-toggle" type="button" aria-expanded="false"><span>Strategy</span><img src="/assets/dashboard-icons/flat/SVG_Source/General_Controls/expand_collapse.svg" alt=""></button>
              <div class="filter-options"><div class="filter-options-inner">
                <label class="filter-option"><input type="checkbox" data-everything="Strategy"><span>Everything</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="tower_placed"><span>Tower placed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="tower_cloned"><span>Tower cloned</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="tower_upgraded"><span>Tower upgraded</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="tower_sold"><span>Tower sold</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="target_mode_changed"><span>Target mode changed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="tower_repositioned"><span>Tower repositioned</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="auto_skip_changed"><span>Auto skip changed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="dj_track_changed"><span>DJ track changed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="ability_used"><span>Ability used</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="wave_skip_clicked"><span>Wave skip clicked</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="boss_appeared"><span>Boss appeared</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="boss_defeated"><span>Boss defeated</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="match_victory"><span>Victory</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="match_loss"><span>Loss</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="strategy_action_failed"><span>Action failed</span></label>
              </div></div>
            </section>

            <section class="filter-group" data-filter-group="Misc" data-open="false">
              <button class="filter-group-toggle" type="button" aria-expanded="false"><span>Misc</span><img src="/assets/dashboard-icons/flat/SVG_Source/General_Controls/expand_collapse.svg" alt=""></button>
              <div class="filter-options"><div class="filter-options-inner">
                <label class="filter-option"><input type="checkbox" data-everything="Misc"><span>Everything</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="reward_claimed"><span>Reward claimed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="run_started"><span>Run started</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="run_paused"><span>Run paused</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="run_resumed"><span>Run resumed</span></label>
                <label class="filter-option"><input type="checkbox" data-filter-type="run_stopped"><span>Run stopped</span></label>
              </div></div>
            </section>
          </section>
        </div>
      </header>

      <div class="activity-list-top"><span data-result-count>0 events</span></div>
      <ol class="activity-list" aria-label="Activity events">
      </ol>
      <p class="activity-empty" data-empty-state>No activity yet.</p>
      <p class="dashboard-feedback" data-feedback role="status" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
