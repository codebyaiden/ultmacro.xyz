<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-title" content="Ultimate Macro">
  <meta name="robots" content="noindex, nofollow">
  <title>Earnings — Dashboard</title>
  <link rel="icon" href="/assets/ultimate-logo.png" type="image/png">
  <link rel="stylesheet" href="/styles/unified-shell.css?v=8">
  <link rel="stylesheet" href="/styles/dashboard-app.css?v=14">
  <link rel="stylesheet" href="/styles/dashboard-product.css?v=6">
  <link rel="stylesheet" href="/styles/dashboard-earnings.css?v=3">
  <script src="/src/unified-shell.js?v=dashboard-nav-20261113b" defer></script>
  <script src="/src/dashboard-tutorial.js?v=6" defer></script>
  <script src="/src/dashboard-earnings.js?v=5" defer></script>
  <script src="/src/dashboard-preferences.js?v=5" defer></script>
  <script src="/src/dashboard-switcher.js?v=6" defer></script>
  <link rel="manifest" href="/dashboard/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/dashboard-192.png?v=site-icon-20261107">
  <link rel="stylesheet" href="/styles/dashboard-room.css?v=8">
</head>
<body class="dashboard-app-page dashboard-earnings-page">
  <a class="dashboard-app-skip" href="#main">Skip to content</a>
  <header class="dashboard-app-fallback"><a href="/">Ultimate Macro</a></header>
  <main id="main" class="dashboard-app-shell">
    <aside class="dashboard-sidebar" aria-label="Dashboard sections">
      <nav class="dashboard-section-nav">
        <a href="/dashboard/overview/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/manage.svg')" aria-hidden="true"></span><span>Overview</span></a>
        <a href="/dashboard/manage/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/manage-controls.svg')" aria-hidden="true"></span><span>Manage</span></a>
        <a href="/dashboard/activity/" ><span class="nav-icon activity-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/activity.svg')" aria-hidden="true"></span><span>Activity</span></a>
        <a href="/dashboard/remote/" ><span class="nav-icon remote-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/remote.svg')" aria-hidden="true"></span><span>Remote</span></a>
        <a href="/dashboard/earnings/" aria-current="page"><span class="nav-icon earnings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/earnings.svg')" aria-hidden="true"></span><span>Earnings</span></a>
        <a href="/dashboard/strategies/" ><span class="nav-icon strategies-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/strategies.svg')" aria-hidden="true"></span><span>Strategies</span></a><a href="/dashboard/health/"><span class="nav-icon health-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/health.svg')" aria-hidden="true"></span><span>Health</span></a>
        <a href="/dashboard/devices/" ><span class="nav-icon devices-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/devices.svg')" aria-hidden="true"></span><span>Devices</span></a>
        <a href="/dashboard/notifications/" ><span class="nav-icon notification-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/notifications.svg')" aria-hidden="true"></span><span>Notifications</span></a>
      </nav>
      <div class="dashboard-sidebar-bottom">
        <a href="/dashboard/settings/" ><span class="nav-icon settings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/settings.svg')" aria-hidden="true"></span><span>Settings</span></a>
      </div>
    </aside>
    <div class="dashboard-app-content earnings-content">
      <header class="earnings-heading">
        <h1>Earnings</h1>
      </header>

      <section class="earnings-summary" aria-label="Earnings by resource">
        <button class="earnings-resource is-selected" type="button" data-resource="coins" aria-pressed="true">
          <img src="/assets/community-impact/coins.png" alt="" width="38" height="38">
          <span class="earnings-resource-name">Coins</span>
          <strong data-total="coins">—</strong>
        </button>
        <button class="earnings-resource" type="button" data-resource="gems" aria-pressed="false">
          <img src="/assets/community-impact/gems.png" alt="" width="38" height="38">
          <span class="earnings-resource-name">Gems</span>
          <strong data-total="gems">—</strong>
        </button>
        <button class="earnings-resource" type="button" data-resource="towerXp" aria-pressed="false">
          <img src="/assets/community-impact/tower-xp-dashboard.png" alt="" width="38" height="38">
          <span class="earnings-resource-name">Tower XP</span>
          <strong data-total="tower-xp">—</strong>
        </button>
      </section>

      <section class="earnings-chart-panel" aria-labelledby="earnings-chart-title">
        <div class="earnings-chart-heading">
          <div class="earnings-chart-title-group">
            <h2 id="earnings-chart-title" data-chart-title>Coins</h2>
            <span data-chart-cadence>Past 24 hours</span>
          </div>
          <div class="earnings-ranges" role="group" aria-label="Chart time range">
            <button type="button" data-range="hour" aria-pressed="false">1 hour</button>
            <button type="button" data-range="day" aria-pressed="true">24 hours</button>
            <button type="button" data-range="week" aria-pressed="false">7 days</button>
            <button type="button" data-range="month" aria-pressed="false">30 days</button>
          </div>
        </div>
        <div class="earnings-chart-wrap">
          <p class="earnings-empty-state" data-chart-empty role="status">No verified rewards in this period.</p>
          <svg class="earnings-chart" data-chart role="img" aria-label="Earnings chart" hidden></svg>
        </div>
        <div class="earnings-chart-xlabels" data-chart-labels aria-hidden="true"></div>
      </section>

      <section class="earnings-latest" aria-labelledby="earnings-latest-title">
        <div class="earnings-latest-heading">
          <h2 id="earnings-latest-title">Latest</h2>
        </div>
        <ul class="earnings-event-list" data-event-list></ul>
        <p class="earnings-empty-state earnings-latest-empty" data-latest-empty role="status">No completed runs in this period.</p>
      </section>
    </div>
  </main>
</body>
</html>
