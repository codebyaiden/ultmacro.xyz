<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex, nofollow">
  <title>Remote — Dashboard</title>
  <link rel="icon" href="/assets/ultimate-logo.png" type="image/png">
  <link rel="stylesheet" href="/styles/unified-shell.css?v=6">
  <link rel="stylesheet" href="/styles/dashboard-app.css?v=11">
  <link rel="stylesheet" href="/styles/dashboard-remote.css?v=5">
  <script src="/src/unified-shell.js?v=dashboard-nav-20261107" defer></script>
  <script src="/src/dashboard-remote.js?v=1" defer></script>
  <script src="/src/dashboard-preferences.js?v=1" defer></script>
  <link rel="manifest" href="/dashboard/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/dashboard-192.png">
</head>
<body class="dashboard-app-page dashboard-remote-page">
  <a class="dashboard-app-skip" href="#main">Skip to content</a>
  <header class="dashboard-app-fallback"><a href="/">Ultimate Macro</a></header>
  <main id="main" class="dashboard-app-shell">
    <aside class="dashboard-sidebar" aria-label="Dashboard sections">
      <nav class="dashboard-section-nav">
        <a href="/dashboard/overview/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/manage.svg')" aria-hidden="true"></span><span>Overview</span></a>
        <a href="/dashboard/manage/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/manage-controls.svg')" aria-hidden="true"></span><span>Manage</span></a>
        <a href="/dashboard/activity/" ><span class="nav-icon activity-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/activity.svg')" aria-hidden="true"></span><span>Activity</span></a>
        <a href="/dashboard/remote/" aria-current="page"><span class="nav-icon remote-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/remote.svg')" aria-hidden="true"></span><span>Remote</span></a>
        <a href="/dashboard/earnings/" ><span class="nav-icon earnings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/earnings.svg')" aria-hidden="true"></span><span>Earnings</span></a>
        <a href="/dashboard/strategies/" ><span class="nav-icon strategies-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/strategies.svg')" aria-hidden="true"></span><span>Strategies</span></a>
        <a href="/dashboard/devices/" ><span class="nav-icon devices-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/devices.svg')" aria-hidden="true"></span><span>Devices</span></a>
        <a href="/dashboard/notifications/" ><span class="nav-icon notification-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/notifications.svg')" aria-hidden="true"></span><span>Notifications</span></a>
      </nav>
      <div class="dashboard-sidebar-bottom">
        <a href="/dashboard/settings/" ><span class="nav-icon settings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/settings.svg')" aria-hidden="true"></span><span>Settings</span></a>
      </div>
    </aside>
    <div class="dashboard-app-content">
      <header class="dashboard-app-heading remote-heading">
        <h1>Remote</h1>
        <a class="remote-device-link" href="/dashboard/devices/" aria-label="Manage connected devices">
          <span class="remote-device-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Devices_And_Connections/desktop_pc.svg')" aria-hidden="true"></span>
          <span>Windows PC</span>
        </a>
      </header>

      <section class="remote-controls" aria-label="Macro remote controls">
          <div class="remote-control-actions" aria-label="Run controls">
            <button class="remote-start" type="button" disabled>
              <img src="/assets/dashboard-icons/flat/SVG_Source/Remote_Controls/start.svg" alt="">
              <span>Start macro</span>
            </button>
            <button class="remote-secondary" type="button" disabled>
              <img src="/assets/dashboard-icons/flat/SVG_Source/Remote_Controls/pause.svg" alt="">
              <span>Pause</span>
            </button>
            <button class="remote-secondary" type="button" disabled>
              <img src="/assets/dashboard-icons/flat/SVG_Source/Remote_Controls/stop.svg" alt="">
              <span>Stop</span>
            </button>
            <button class="remote-switch-strategy" type="button" disabled>
              <img src="/assets/dashboard-icons/flat/SVG_Source/Remote_Controls/switch_strategy.svg" alt="">
              <span>Switch strategy</span>
            </button>
          </div>
      </section>

      <section class="remote-run-readout" aria-label="Current run">
          <div class="remote-readout-heading">
            <h2>Current run</h2>
            <a href="/dashboard/activity/">Activity</a>
          </div>
          <p class="remote-run-empty">No run in progress.</p>
      </section>

      <section class="remote-behavior" aria-labelledby="remote-behavior-title">
        <div class="remote-section-heading">
          <h2 id="remote-behavior-title">Run behavior</h2>
          <span data-remote-save-state aria-live="polite"></span>
        </div>
        <div class="remote-behavior-list" data-remote-preferences>
          <label class="remote-setting-row">
            <span><strong>Auto equip towers</strong><small>Use the loadout saved with each strategy.</small></span>
            <input type="checkbox" data-setting="autoEquip" checked>
            <span class="remote-switch" aria-hidden="true"></span>
          </label>
          <label class="remote-setting-row">
            <span><strong>Alternate strategies</strong><small>Switch between strategy slots 1 and 2.</small></span>
            <input type="checkbox" data-setting="alternateStrategies">
            <span class="remote-switch" aria-hidden="true"></span>
          </label>
          <label class="remote-setting-row">
            <span><strong>Repeat after a match</strong><small>Start again after the result.</small></span>
            <input type="checkbox" data-setting="repeatAfterResult">
            <span class="remote-switch" aria-hidden="true"></span>
          </label>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
