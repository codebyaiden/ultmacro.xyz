<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-title" content="Ultimate Macro">
  <meta name="robots" content="noindex, nofollow">
  <title>Strategies — Dashboard</title>
  <link rel="icon" href="/assets/ultimate-logo.png" type="image/png">
  <link rel="stylesheet" href="/styles/unified-shell.css?v=8">
  <link rel="stylesheet" href="/styles/dashboard-app.css?v=14">
  <link rel="stylesheet" href="/styles/dashboard-product.css?v=6">
  <link rel="stylesheet" href="/styles/dashboard-strategies.css?v=5">
  <link rel="stylesheet" href="/styles/dashboard-strategy-library.css?v=4">
  <script src="/src/unified-shell.js?v=dashboard-pairing-style-20261115" defer></script>
  <script src="/src/dashboard-tutorial.js?v=7" defer></script>
  <script src="/src/dashboard-state.js?v=2" defer></script>
  <script src="/src/dashboard-strategies.js?v=6" defer></script>
  <script src="/src/dashboard-strategy-library.js?v=4" defer></script>
  <script src="/src/dashboard-preferences.js?v=12" defer></script>
  <script src="/src/dashboard-switcher.js?v=7" defer></script>
  <link rel="manifest" href="/dashboard/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/dashboard-192.png?v=site-icon-20261107">
  <link rel="stylesheet" href="/styles/dashboard-room.css?v=21">

</head>
<body class="dashboard-app-page">
  <a class="dashboard-app-skip" href="#main">Skip to content</a>
  <header class="dashboard-app-fallback"><a href="/">Ultimate Macro</a></header>
  <main id="main" class="dashboard-app-shell">
    <aside class="dashboard-sidebar" aria-label="Dashboard sections">
      <nav class="dashboard-section-nav">
        <a href="/dashboard/overview/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/manage.svg')" aria-hidden="true"></span><span>Overview</span></a>
        <a href="/dashboard/manage/"><span class="nav-icon manage-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/manage-controls.svg')" aria-hidden="true"></span><span>Manage</span></a>
        <a href="/dashboard/activity/" ><span class="nav-icon activity-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/activity.svg')" aria-hidden="true"></span><span>Activity</span></a>
        <a href="/dashboard/remote/" ><span class="nav-icon remote-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/remote.svg')" aria-hidden="true"></span><span>Remote</span></a>
        <a href="/dashboard/earnings/" ><span class="nav-icon earnings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/earnings.svg')" aria-hidden="true"></span><span>Earnings</span></a>
        <a href="/dashboard/strategies/" aria-current="page"><span class="nav-icon strategies-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/strategies.svg')" aria-hidden="true"></span><span>Strategies</span></a>
        <a href="/dashboard/health/"><span class="nav-icon health-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/health.svg')" aria-hidden="true"></span><span>Health</span></a>
        <a href="/dashboard/devices/" ><span class="nav-icon devices-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/devices.svg')" aria-hidden="true"></span><span>Devices</span></a>
        <a href="/dashboard/notifications/" ><span class="nav-icon notification-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/notifications.svg')" aria-hidden="true"></span><span>Notifications</span></a>
      </nav>
      <div class="dashboard-sidebar-bottom">
        <a href="/dashboard/settings/" ><span class="nav-icon settings-icon icon-mask" style="--icon-url:url('/assets/dashboard-icons/flat/SVG_Source/Main_Navigation/settings.svg')" aria-hidden="true"></span><span>Settings</span></a>
      </div>
    </aside>
    <div class="dashboard-app-content dashboard-strategies-content">
      <header class="dashboard-app-heading"><h1>Strategies</h1></header>
      <nav class="strategy-view-tabs" aria-label="Strategy sections">
        <button type="button" data-strategy-view="yours" aria-selected="true">Your Strategies</button>
        <button type="button" data-strategy-view="library" aria-selected="false">Library</button>
      </nav>
      <p class="strategy-feedback" data-strategy-feedback role="status" aria-live="polite"></p>
      <div class="strategy-device-list" data-strategy-device-list aria-live="polite">
        <p class="strategy-empty-state">Waiting for macro data.</p>
      </div>
      <section class="strategy-public-library" data-strategy-library hidden aria-label="Strategy Library">
        <div class="strategy-library-toolbar">
          <label class="strategy-library-search"><span class="strategy-sr-only">Search the Library</span><input type="search" data-library-search placeholder="Search strategies" autocomplete="off"></label>
          <div class="strategy-library-filters" role="group" aria-label="Filter strategies">
            <button type="button" data-library-sort="recent" aria-pressed="true">All</button>
            <button type="button" data-library-sort="popular" aria-pressed="false">Popular</button>
            <button type="button" data-library-sort="featured" aria-pressed="false">Featured</button>
            <button type="button" data-library-sort="pinned" aria-pressed="false">Pinned</button>
          </div>
        </div>
        <p class="strategy-library-feedback" data-library-feedback role="status" aria-live="polite"></p>
        <div class="strategy-library-grid" data-library-grid></div>
      </section>
    </div>
  </main>
  <dialog class="strategy-unverified-dialog" data-library-dialog>
    <form method="dialog" class="strategy-unverified-card">
      <button class="strategy-dialog-close" value="cancel" aria-label="Close">×</button>
      <div class="strategy-dialog-preview" data-dialog-preview hidden></div>
      <h2 data-dialog-title></h2>
      <p class="strategy-dialog-byline" data-dialog-byline></p>
      <p class="strategy-dialog-metrics" data-dialog-metrics></p>
      <button type="button" class="strategy-dialog-follow" data-dialog-follow>Follow updates</button>
      <p class="strategy-dialog-description" data-dialog-description></p>
      <p class="strategy-unverified-note">Not reviewed by the Ultimate Macro team. It may be outdated or behave differently than described.</p>
      <label class="strategy-dialog-picker" data-dialog-file-wrap hidden>Strategy file<select data-dialog-file></select></label>
      <label class="strategy-dialog-picker" data-dialog-device-wrap hidden>Install on<select data-dialog-device></select></label>
      <p class="strategy-dialog-status" data-dialog-status role="status" aria-live="polite"></p>
      <div class="strategy-dialog-actions">
        <button type="button" class="strategy-dialog-cancel" data-dialog-cancel>Cancel</button>
        <button type="button" class="strategy-dialog-download" data-dialog-install>Add to macro</button>
      </div>
      <button type="button" class="strategy-dialog-manual-download" data-dialog-download>Download .strat instead</button>
    </form>
  </dialog>
</body>
</html>
