<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090b10" />
    <meta
      name="description"
      content="Help shape Ultimate Macro. Share your feedback in about 5–7 minutes."
    />
    <title>Help shape Ultimate Macro</title>
    <link rel="icon" href="/icon.ico" />
    <link rel="stylesheet" href="/styles/poll.css" />
    <script src="/src/poll-clock.js" defer></script>
    <script src="/src/poll-motion.js" defer></script>
    <script src="/src/poll.js" defer></script>
  </head>
  <body data-scene="landing">
    <div class="atmosphere" aria-hidden="true">
      <div class="halo halo-a"></div>
      <div class="halo halo-b"></div>
      <div class="halo halo-c"></div>
      <div class="grain"></div>
      <div class="grid-horizon"></div>
    </div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ultimate Macro home"
        ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span
        >Ultimate Macro<span class="brand-divider">/</span
        ><span class="brand-sub">feedback</span></a
    </header>
    <main id="survey" class="survey" aria-busy="true">
      <section class="landing" aria-labelledby="landing-title">
        <div class="landing-copy">
          <h1 id="landing-title">
            help shape<br /><span class="gradient">Ultimate<br />Macro.</span>
          </h1>
          <div class="landing-action">
            <button id="start" class="primary" disabled>
              Loading your survey…</button
            ><span class="time-note">about 5–7 ish min(s)</span>
          </div>
        </div>
        <div class="landing-art" aria-hidden="true">
          <div class="signal-orbit">
            <div class="orbit-ring ring-outer"></div>
            <div class="orbit-ring ring-middle"></div>
            <div class="orbit-ring ring-inner"></div>
            <div class="signal-core">
              <img
                class="core-icon"
                src="/poll/assets/poll-mascot.png"
                alt=""
              />
            </div>
            <div class="orbit-spark spark-a"></div>
            <div class="orbit-spark spark-b"></div>
          </div>
          <div class="floating-card card-reliability">
            <span class="card-glyph">↗</span>
            <div>
              <b>reliability</b><small>less friction. more trust.</small>
            </div>
            <span class="mini-wave"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="floating-card card-ideas">
            <span class="card-glyph">✳</span>
            <div>
              <b>your next big idea</b
              ><small>it starts with a little feedback.</small>
            </div>
          </div>
        </div>
        <p class="privacy">
          This survey exists purely to improve Ultimate Macro.
        </p>
      </section>
    </main>
    <div class="status-area">
      <span class="save-orb" aria-hidden="true"></span>
      <p id="save-status" role="status" aria-live="polite"></p>
      <p id="error" role="alert"></p>
      <button id="retry" class="quiet" hidden>Try again</button>
    </div>
    <footer class="footer">
      <span>small answers. real direction.</span
      ><button class="orbit-secret" type="button" aria-label="A little spark">
        ✳</button
      ><a href="/">ultmacro.xyz ↗</a>
    </footer>
    <div id="motion-note" role="status" aria-live="polite"></div>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to answer this adaptive survey.
      </p></noscript
    >
  </body>
</html>
